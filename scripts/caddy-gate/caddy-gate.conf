# systemd drop-in that makes the gate secrets available to Caddy as
# {env.GATE_SECRET} and {env.GATE_SECRET_OLD}.
#
# Install as /etc/systemd/system/caddy.service.d/caddy-gate.conf:
#
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp caddy-gate.conf /etc/systemd/system/caddy.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart caddy
#
# A drop-in is used instead of editing the packaged caddy.service so that
# package updates do not overwrite it.
#
# systemd reads EnvironmentFile itself, as root, before starting Caddy, so
# /etc/caddy/gate.env can stay chmod 600 root-only.
#
# Note: `systemctl reload caddy` does NOT re-read the environment file. After
# changing the secrets a full `systemctl restart caddy` is required - that is
# what rotate-gate-secret.sh does.

[Service]
EnvironmentFile=/etc/caddy/gate.env

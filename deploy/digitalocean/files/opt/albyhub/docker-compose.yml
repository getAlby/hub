services:
  albyhub:
    container_name: albyhub
    image: ghcr.io/getalby/hub:__ALBYHUB_VERSION__
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WORK_DIR: /data/albyhub
      SETUP_CODE: ${SETUP_CODE:?First-boot setup code is required}
    restart: unless-stopped
    stop_grace_period: 300s

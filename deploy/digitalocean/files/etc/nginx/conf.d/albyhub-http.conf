# Public HTTP is exclusively for ACME; never proxy Hub or redirect credentials.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

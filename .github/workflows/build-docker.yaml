name: Multiplatform Docker build & push
on:
  push:
jobs:
  build:
    env:
      REGISTRY: ghcr.io
      IMAGENAME: ${{ github.event.repository.name }}
      TAG: ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    steps:
      # see https://github.com/orgs/community/discussions/25678#discussioncomment-5242449
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
        name: Check out code
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "./go.mod"
      - name: Run tests
        run: mkdir frontend/dist && touch frontend/dist/tmp && go test ./...
      - name: Docker build
        if: github.actor != 'dependabot[bot]'
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ADD_LATEST: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/$IMAGENAME"
          # Preserve the previous action's lowercase, sanitized, 120-character ref slug.
          tag=$(node -e 'process.stdout.write(process.env.TAG.toLowerCase().replace(/[^\w.-]+/g, "-").replace(/^[^\w]+/, "").substring(0, 120))')
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            tag="$tag-${GITHUB_SHA:0:7}"
          fi
          tags=(--tag "$image:$tag")
          if [[ "$ADD_LATEST" == true ]]; then
            tags+=(--tag "$image:latest")
          fi

          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker buildx create --use
          # Refresh all referenced base images while retaining normal layer caching.
          docker buildx build --pull --push \
            --file Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg "TAG=$TAG" \
            "${tags[@]}" .
